name: CI

on:
  push:
    # Branch pushes are covered by PR checks; tags have dedicated release gates.
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run release-surface quality checks
        shell: bash
        run: bash scripts/check_release_quality.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --frozen --python ${{ matrix.python-version }} python -m pytest -q

  build-distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Verify packaged source and wheel RECORD
        run: python scripts/verify_release_artifacts.py --dist-dir dist

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ci-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Full tests qualify the locked optional stack on 3.11-3.13. Fresh base
  # installs exercise the same built wheel on 3.11-3.14.
  wheel-smoke:
    needs: build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: ci-distributions
          path: dist/

      - name: Smoke test installed base wheel
        shell: bash
        run: bash scripts/smoke_install_wheel.sh "${{ matrix.python-version }}" dist
